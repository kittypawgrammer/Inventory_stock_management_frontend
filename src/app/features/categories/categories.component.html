<main class="mx-auto max-w-7xl p-6">
  <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="mt-2 text-3xl font-semibold text-slate-900">Categories</h1>
    </div>

    <a
      routerLink="/categories/add"
      class="inline-flex items-center justify-center rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
    >
      + Add Category
    </a>
  </div>

  <div class="mt-6 grid gap-4 md:grid-cols-3">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm text-slate-500">Total Categories</p>
      <p class="mt-3 text-3xl font-semibold text-slate-900">{{ categories.length }}</p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm text-slate-500">Active</p>
      <p class="mt-3 text-3xl font-semibold text-emerald-600">{{ countByStatus('Active') }}</p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm text-slate-500">Low Use</p>
      <p class="mt-3 text-3xl font-semibold text-sky-600">{{ countByStatus('Low Use') }}</p>
    </div>
  </div>

  <section class="mt-8">
    <app-categories-list
      [categories]="categories"
      (deleteCategoryEvent)="deleteCategory($event)"
    ></app-categories-list>
  </section>
</main>
