<section class="flex h-full min-h-0 flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
  <div class="border-b border-slate-200 px-4 py-3">
    <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <h2 class="text-lg font-semibold text-slate-900">Category List</h2>

      <div class="flex flex-col gap-3 md:flex-row md:items-center">
        <label class="relative block min-w-[180px]">
          <span class="sr-only">Search categories</span>

          <input
            type="search"
            placeholder="Search categories"
            class="w-full rounded-xl border border-slate-300 bg-slate-50 py-2 pl-9 pr-3 text-sm text-slate-700 placeholder:text-slate-400 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
          />

          <svg
            class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
            viewBox="0 0 20 20"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M9 3.5a5.5 5.5 0 104.39 9.39l2.96 2.96a1 1 0 101.41-1.41l-2.96-2.96A5.5 5.5 0 009 3.5zm0 2a3.5 3.5 0 110 7 3.5 3.5 0 010-7z"
              clip-rule="evenodd"
            />
          </svg>
        </label>

        <select
          class="rounded-xl border border-slate-300 bg-slate-50 px-3 py-2 text-sm text-slate-700 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
          aria-label="Filter by status"
        >
          <option>All Status</option>
          <option>Active</option>
          <option>Low Use</option>
          <option>Inactive</option>
        </select>
      </div>
    </div>
  </div>

  <div class="min-h-0 flex-1 overflow-y-auto overflow-x-auto">
    <table class="min-w-full divide-y divide-slate-200 text-left">
      <thead class="bg-slate-50 text-sm text-slate-600">
        <tr>
          <th class="px-4 py-3 font-medium">Category</th>
          <th class="px-4 py-3 font-medium">Description</th>
          <th class="px-4 py-3 font-medium">Products</th>
          <th class="px-4 py-3 font-medium">Status</th>
          <th class="px-4 py-3 font-medium text-right">Actions</th>
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-200 bg-white text-sm text-slate-700">
        <tr *ngFor="let category of categories">
          <td class="px-4 py-3">
            <div class="font-medium text-slate-900">{{ category.name }}</div>
          </td>

          <td class="px-4 py-3 text-slate-600">{{ category.description }}</td>

          <td class="px-4 py-3">{{ category.products }}</td>

          <td class="px-4 py-3">
            <span
              [ngClass]="{
                'bg-emerald-100 text-emerald-700': category.status === 'Active',
                'bg-amber-100 text-amber-700': category.status === 'Low Use',
                'bg-red-100 text-red-700': category.status === 'Inactive'
              }"
              class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium"
            >
              {{ category.status }}
            </span>
          </td>

          <td class="px-4 py-3">
            <div class="flex justify-end gap-2">
              <a
                [routerLink]="['/categories/edit', category.id]"
                class="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50"
              >
                Edit
              </a>

              <button
                type="button"
                (click)="deleteCategory(category.id)"
                class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-medium text-red-600 hover:bg-red-50"
              >
                Delete
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="border-t border-slate-200 px-4 py-2">
    <div class="flex items-center justify-between text-sm text-slate-500">
      <span>Showing {{ categories.length }} categories</span>

      <div class="flex items-center gap-2">
        <button type="button" class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-50">
          Previous
        </button>

        <button type="button" class="rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-50">
          Next
        </button>
      </div>
    </div>
  </div>
</section>
