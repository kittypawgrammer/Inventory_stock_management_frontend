<main class="mx-auto max-w-5xl p-6">
  <div class="mb-6 flex items-center justify-between gap-4">
    <div>
      <p class="text-sm font-medium uppercase tracking-[0.2em] text-emerald-600">Categories</p>
      <h1 class="mt-2 text-3xl font-semibold text-slate-900">
        {{ isEditMode ? 'Edit Category' : 'Add Category' }}
      </h1>
    </div>

    <button
      type="button"
      (click)="cancel()"
      class="rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50"
    >
      Back to list
    </button>
  </div>

  <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="grid gap-5 md:grid-cols-2">
      <div class="md:col-span-2">
        <label for="category-name" class="mb-2 block text-sm font-medium text-slate-700">Category Name</label>
        <input
          id="category-name"
          type="text"
          formControlName="name"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
          [class.border-red-500]="categoryForm.get('name')?.touched && categoryForm.get('name')?.invalid"
        />
        <p *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.invalid" class="mt-1 text-xs text-red-600">
          Category name is required.
        </p>
      </div>

      <div class="md:col-span-2">
        <label for="category-description" class="mb-2 block text-sm font-medium text-slate-700">Description</label>
        <textarea
          id="category-description"
          rows="4"
          formControlName="description"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
          [class.border-red-500]="categoryForm.get('description')?.touched && categoryForm.get('description')?.invalid"
        ></textarea>
        <p *ngIf="categoryForm.get('description')?.touched && categoryForm.get('description')?.invalid" class="mt-1 text-xs text-red-600">
          Description must be at least 10 characters.
        </p>
      </div>

      <div>
        <label for="category-products" class="mb-2 block text-sm font-medium text-slate-700">Products in Category</label>
        <input
          id="category-products"
          type="number"
          formControlName="products"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
          [class.border-red-500]="categoryForm.get('products')?.touched && categoryForm.get('products')?.invalid"
        />
        <p *ngIf="categoryForm.get('products')?.touched && categoryForm.get('products')?.invalid" class="mt-1 text-xs text-red-600">
          Products count cannot be negative.
        </p>
      </div>

      <div>
        <label for="category-status" class="mb-2 block text-sm font-medium text-slate-700">Status</label>
        <select
          id="category-status"
          formControlName="status"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
        >
          <option>Active</option>
          <option>Low Use</option>
          <option>Inactive</option>
        </select>
      </div>

      <div>
        <label for="category-order" class="mb-2 block text-sm font-medium text-slate-700">Display Order</label>
        <input
          id="category-order"
          type="number"
          formControlName="displayOrder"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
          [class.border-red-500]="categoryForm.get('displayOrder')?.touched && categoryForm.get('displayOrder')?.invalid"
        />
        <p *ngIf="categoryForm.get('displayOrder')?.touched && categoryForm.get('displayOrder')?.invalid" class="mt-1 text-xs text-red-600">
          Display order must be at least 1.
        </p>
      </div>

      <div class="md:col-span-2 flex flex-col gap-3 pt-2 sm:flex-row sm:justify-end">
        <button type="button" (click)="cancel()" class="rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
          Cancel
        </button>
        <button type="submit" class="rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
          {{ isEditMode ? 'Update Category' : 'Save Category' }}
        </button>
      </div>
    </form>
  </section>
</main>
