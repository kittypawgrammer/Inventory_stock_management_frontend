<main class="mx-auto max-w-7xl p-6">

  <section class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4" aria-label="Inventory summary">
    <article class="border-t-4 border-sky-500 rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <p class="text-sm font-medium text-slate-500">Total Products</p>
      <p class="mt-3 text-3xl font-semibold text-slate-900">128</p>
      <p class="mt-1 text-sm text-slate-500">Active products</p>
    </article>

    <article class="border-t-4 border-emerald-500 rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <p class="text-sm font-medium text-slate-500">Total Stock</p>
      <p class="mt-3 text-3xl font-semibold text-slate-900">1,248</p>
      <p class="mt-1 text-sm text-slate-500">Units in inventory</p>
    </article>

    <article class="border-t-4 border-amber-500 rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <p class="text-sm font-medium text-slate-500">Low Stock</p>
      <p class="mt-3 text-3xl font-semibold text-slate-900">12</p>
      <p class="mt-1 text-sm text-slate-500">Products need attention</p>
    </article>

    <article class="border-t-4 border-rose-500 rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <p class="text-sm font-medium text-slate-500">Out of Stock</p>
      <p class="mt-3 text-3xl font-semibold text-slate-900">4</p>
      <p class="mt-1 text-sm text-slate-500">Products unavailable</p>
    </article>
  </section>
</main>
