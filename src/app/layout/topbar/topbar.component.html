<header class="flex min-h-20 flex-wrap items-center justify-between gap-4 border-b border-slate-200 bg-white px-6 py-4">
  <div>
    <h1 class="mt-1 text-lg font-semibold text-slate-900">Welcome back, Admin</h1>
    <p class="mt-1 text-sm text-slate-500">Here's what's happening with your inventory today.</p>
  </div>

  <div class="order-3 w-full md:order-2 md:w-auto md:min-w-72 lg:min-w-96">
    <label for="inventory-search" class="sr-only">Search inventory</label>
    <div class="relative">
      <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400" aria-hidden="true">⌕</span>
      <input
        id="inventory-search"
        type="search"
        placeholder="Search by product, supplier or category"
        class="w-full rounded-lg border border-slate-200 bg-slate-50 py-2.5 pl-9 pr-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"
      />
    </div>
  </div>

  <div class="order-2 flex items-center gap-3 md:order-3">

    <div class="flex items-center gap-2 border-l border-slate-200 pl-3">
      <a routerLink="/dashboard" aria-label="Open admin profile" class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-100 text-sm font-semibold text-blue-700 transition-colors hover:bg-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        A
      </a>
      <span class="hidden text-sm font-medium text-slate-700 sm:inline">Admin</span>
    </div>
  </div>
</header>
