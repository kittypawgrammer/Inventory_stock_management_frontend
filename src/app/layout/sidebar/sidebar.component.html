<aside class="flex min-h-screen w-64 shrink-0 flex-col bg-slate-950 px-4 py-6 text-slate-300">
  <div class="border-b border-slate-800 px-3 pb-6">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-blue-400">Inventory</p>
    <h2 class="mt-2 text-lg font-semibold leading-6 text-white">Stock Management</h2>
  </div>

  <nav class="mt-8 flex-1" aria-label="Sidebar navigation">
    <p class="px-3 text-xs font-semibold uppercase tracking-wider text-slate-500">Workspace</p>

    <div class="mt-3 space-y-1">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-blue-600 text-white shadow-lg shadow-blue-950/30"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
        <span class="mr-3 w-5 text-center text-base" aria-hidden="true">⌂</span>
        Dashboard
      </a>

      <a
        routerLink="/products"
        routerLinkActive="bg-blue-600 text-white shadow-lg shadow-blue-950/30"
        class="flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
        <span class="mr-3 w-5 text-center text-base" aria-hidden="true">▦</span>
        Products
      </a>

      <a
        routerLink="/categories"
        routerLinkActive="bg-blue-600 text-white shadow-lg shadow-blue-950/30"
        class="flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
        <span class="mr-3 w-5 text-center text-base" aria-hidden="true">◈</span>
        Categories
      </a>

      <a
        routerLink="/suppliers"
        routerLinkActive="bg-blue-600 text-white shadow-lg shadow-blue-950/30"
        class="flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
        <span class="mr-3 w-5 text-center text-base" aria-hidden="true">♧</span>
        Suppliers
      </a>
    </div>

    <div class="my-7 border-t border-slate-800"></div>

    <p class="px-3 text-xs font-semibold uppercase tracking-wider text-slate-500">System</p>
    <div class="mt-3 space-y-1">
      <button type="button" class="flex w-full items-center rounded-lg px-3 py-2.5 text-left text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-400">
        <span class="mr-3 w-5 text-center text-base" aria-hidden="true">⚙</span>
        Settings
      </button>
      <button type="button" class="flex w-full items-center rounded-lg px-3 py-2.5 text-left text-sm font-medium transition-colors hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-400">
        <span class="mr-3 w-5 text-center text-base" aria-hidden="true">♙</span>
        Users
      </button>
    </div>
  </nav>

  <button type="button" class="flex items-center rounded-lg px-3 py-2.5 text-sm font-medium text-slate-400 transition-colors hover:bg-red-500/10 hover:text-red-300 focus:outline-none focus:ring-2 focus:ring-red-400">
    <span class="mr-3 w-5 text-center text-base" aria-hidden="true">↪</span>
    Sign out
  </button>
</aside>
